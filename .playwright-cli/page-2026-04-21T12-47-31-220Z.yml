    - generic [ref=e234]: 研究に裏打ちされた方法
    - heading "音素認識科学に基づく" [level=2] [ref=e235]
    - generic [ref=e236]:
      - generic [ref=e237]:
        - heading "研究" [level=3] [ref=e238]
        - paragraph [ref=e239]: Patricia Kuhlの乳児言語発達研究（ワシントン大学）とMcClelland、Fiez、McCandliss（2002）の成人への音素弁別訓練に関する研究に基づいています。これらの研究は、幼少期の経験が意味のある音の区別として認識されるものを形成することを示しています。
      - generic [ref=e240]:
        - heading "効果の理由" [level=3] [ref=e241]
        - paragraph [ref=e242]: 脳は可塑的です - 再訓練が可能です。日本人成人は即座の視覚フィードバックにより、/r/と/l/の識別が50%から70-80%の精度に向上しました。ミニマルペアの繰り返し練習が音の識別のための新しい神経経路を作り出します。
      - generic [ref=e243]:
        - heading "実証された結果" [level=3] [ref=e244]
        - paragraph [ref=e245]: わずか3回の20分セッション後、脳スキャンで新しい活性化パターンが現れ、知覚マップが再配線されたことが示されました。一貫した練習により、測定可能で永続的な認識精度の向上が得られます。

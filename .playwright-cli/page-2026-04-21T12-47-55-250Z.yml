        - paragraph [ref=e243]: Patricia Kuhl의 유아 언어 발달 연구(워싱턴 대학교)와 McClelland, Fiez, McCandliss(2002)의 성인 음소 식별 교육에 관한 연구를 기반으로 합니다. 이러한 연구는 초기 노출이 의미 있는 것으로 인식되는 소리 구별을 형성한다는 것을 보여줍니다.
